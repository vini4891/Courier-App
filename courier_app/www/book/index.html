{% extends "templates/web.html" %}

{% block title %}{{ title }}{% endblock %}

{% block header %}<h2>{{ title }}</h2>{% endblock %}

{% block page_content %}
<link rel="stylesheet" href="/assets/courier_app/css/courier_portal.css">
<script>window.CSRF_TOKEN = "{{ csrf_token }}";</script>
<script src="/assets/courier_app/js/courier_portal.js"></script>

<div class="courier-card courier-card-wide">
	<div id="courier-banner" class="courier-banner"></div>

	<form id="book-form">
		<div class="courier-section-title">Sender</div>
		<div class="courier-row">
			<div class="courier-field"><label>Full Name *</label><input name="sender_name" required></div>
			<div class="courier-field"><label>Phone *</label><input name="sender_phone" required></div>
		</div>
		<div class="courier-field"><label>Email</label><input type="email" name="sender_email"></div>
		<div class="courier-field"><label>Address Line 1 *</label><input name="sender_address_line1" required></div>
		<div class="courier-field"><label>Address Line 2</label><input name="sender_address_line2"></div>
		<div class="courier-row">
			<div class="courier-field"><label>City *</label><input name="sender_city" required></div>
			<div class="courier-field"><label>State</label><input name="sender_state"></div>
			<div class="courier-field"><label>Pincode *</label><input name="sender_pincode" required></div>
		</div>

		<div class="courier-section-title">Recipient</div>
		<div class="courier-row">
			<div class="courier-field"><label>Full Name *</label><input name="recipient_name" required></div>
			<div class="courier-field"><label>Phone *</label><input name="recipient_phone" required></div>
		</div>
		<div class="courier-field"><label>Email</label><input type="email" name="recipient_email"></div>
		<div class="courier-field"><label>Address Line 1 *</label><input name="recipient_address_line1" required></div>
		<div class="courier-field"><label>Address Line 2</label><input name="recipient_address_line2"></div>
		<div class="courier-row">
			<div class="courier-field"><label>City *</label><input name="recipient_city" required></div>
			<div class="courier-field"><label>State</label><input name="recipient_state"></div>
			<div class="courier-field"><label>Pincode *</label><input name="recipient_pincode" required></div>
		</div>

		<div class="courier-section-title">Shipment</div>
		<div class="courier-row">
			<div class="courier-field">
				<label>Service Level *</label>
				<select name="service_level" id="service-level-select" required></select>
			</div>
			<div class="courier-field"><label>Weight (Kg) *</label><input type="number" step="0.01" min="0.01" name="weight_kg" required></div>
		</div>
		<div class="courier-row">
			<div class="courier-field"><label>Length (cm)</label><input type="number" step="0.1" name="length_cm"></div>
			<div class="courier-field"><label>Width (cm)</label><input type="number" step="0.1" name="width_cm"></div>
			<div class="courier-field"><label>Height (cm)</label><input type="number" step="0.1" name="height_cm"></div>
		</div>
		<div class="courier-field"><label>Declared Value</label><input type="number" step="0.01" name="declared_value"></div>

		<button type="submit" class="courier-btn" id="book-submit">Book Parcel</button>
	</form>
</div>
{% endblock %}
